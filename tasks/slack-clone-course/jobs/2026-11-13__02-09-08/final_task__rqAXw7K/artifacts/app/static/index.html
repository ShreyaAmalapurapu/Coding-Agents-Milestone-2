<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Huddle</title><link rel="stylesheet" href="/static/app.css"></head><body>
<div id="auth-modal"><form data-testid="auth-form" id="auth-form"><h1>Huddle</h1><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" placeholder="Display name"><button type="submit" id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Create account</button><div id="auth-error"></div></form></div>
<div id="app" hidden><aside><div data-testid="workspace-header" id="workspace-header">Huddle</div><div data-testid="current-user" id="current-user"></div><button data-testid="logout-btn" data-button-role="danger" id="logout-btn">Log out</button><div data-testid="channel-list" id="channel-list"></div><div data-testid="dms-list" id="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary" id="new-channel-btn">New channel</button><button data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button><form data-testid="workspace-create-form" id="workspace-create-form"><label for="workspace-slug">Workspace slug</label><input id="workspace-slug" name="slug" placeholder="workspace slug" autocomplete="off" required><label for="workspace-name">Workspace name</label><input id="workspace-name" name="name" placeholder="workspace name" autocomplete="off" required><button type="submit" data-testid="workspace-create-submit" data-button-role="primary">Create workspace</button></form><div id="empty-workspace-copy">Create a workspace to start chatting.</div><form data-testid="join-workspace-form"><input name="code" placeholder="Invitation code"><button type="submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><span data-testid="join-workspace-error" role="alert"></span></form></aside>
<main><header><h2 data-testid="channel-title" id="channel-title">Select a channel</h2><span data-testid="channel-topic" id="channel-topic"></span><button data-testid="channel-settings-btn" data-button-role="secondary">Settings</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace</button></header><section data-testid="message-list" id="message-list"></section><div class="composer"><input data-testid="message-input" id="message-input"><button data-testid="send-btn" data-button-role="primary">Send</button></div></main>
<aside class="thread" data-testid="thread-panel" id="thread-panel"><button data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button></aside></div>
<div id="create-channel-modal"><form data-testid="create-channel-form" id="create-channel-form"><input name="name"><label><input type="checkbox" data-testid="create-channel-private" id="create-channel-private">Private</label><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal"><h3 data-testid="channel-settings-title">Channel settings</h3><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><div data-testid="channel-members-list"></div><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal"><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><div data-testid="invitations-list"></div></div><div data-testid="settings-pane-general"></div></div>
<form data-testid="create-invitation-form" id="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><span data-testid="invitation-code"></span></form>
<script src="/static/app.js"></script></body></html>
