<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title><link rel="stylesheet" href="/static/app.css"></head><body>
<div id="auth-modal"><form data-testid="auth-form"><h1>Huddle</h1><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" placeholder="Display name"><button type="submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" data-testid="auth-toggle">Create account</button><div id="auth-error"></div></form></div>
<div id="app" hidden><aside><header data-testid="workspace-header">Huddle</header><div data-testid="current-user"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><nav data-testid="channel-list"></nav><nav data-testid="dms-list"></nav><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="logout-btn" data-button-role="danger">Logout</button></aside>
<main><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><section data-testid="message-list"></section><form id="message-form"><input data-testid="message-input" name="body" autocomplete="off"><button data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" data-testid="thread-panel" hidden><button data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><form><input data-testid="thread-input"><button type="button" data-testid="thread-send" data-button-role="primary">Reply</button></form></aside></div>
<div id="create-channel-modal" hidden><form data-testid="create-channel-form"><input name="name"><label><input type="checkbox" data-testid="create-channel-private" name="is_private">Private</label><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><h3 data-testid="channel-settings-title">Channel settings</h3><button data-testid="channel-settings-close" data-button-role="secondary">Close</button><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" hidden><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><section data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></section><section data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button><div data-testid="invitations-list"><span data-testid="invitation-code"></span></div></form></section><section data-testid="settings-pane-general"></section></div>
<section id="empty-state" hidden><button data-testid="empty-state-create-workspace">Create workspace</button><form data-testid="workspace-create-form"><input name="name" placeholder="Workspace name"><input name="slug" placeholder="workspace-slug"><button type="submit" data-button-role="primary">Create workspace</button><div role="alert"></div></form><form data-testid="join-workspace-form"><input name="code" placeholder="Invitation code"><button type="submit" data-testid="join-workspace-submit" data-button-role="primary">Join workspace</button><span data-testid="join-workspace-error" role="alert"></span></form></section>
<script src="/static/app.js"></script></body></html>
