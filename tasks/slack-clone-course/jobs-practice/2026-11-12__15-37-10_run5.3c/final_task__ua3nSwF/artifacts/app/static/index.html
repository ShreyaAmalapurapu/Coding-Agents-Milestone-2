<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Huddle</title><link rel="stylesheet" href="/static/app.css"></head><body>
<div id="app"><aside><h2>Huddle</h2><div data-testid="workspace-header">Workspace</div><div data-testid="current-user"></div><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button data-testid="logout-btn" data-button-role="danger">Logout</button></aside>
<main><header><h1 data-testid="channel-title"># general</h1><span data-testid="channel-topic"></span><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><section data-testid="message-list"></section><form id="message-form"><input data-testid="message-input" name="message" autocomplete="off"><button data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<section data-testid="thread-panel" hidden><button data-testid="close-thread" data-button-role="secondary">Close</button><div data-testid="thread-list"></div><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button></section></div>
<div id="auth-modal"><form data-testid="auth-form"><h2>Sign in</h2><input name="username" required><input name="password" type="password" required><button type="submit" data-testid="auth-submit" data-button-role="primary">Sign in</button><button type="button" data-testid="auth-toggle">Create account</button><div data-testid="auth-error"></div></form></div>
<form data-testid="workspace-create-form"><input name="slug"><input name="name"><button type="submit" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form>
<form data-testid="join-workspace-form"><input name="code"><button type="submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><div data-testid="join-workspace-error"></div></form>
<div id="create-channel-modal" hidden><form data-testid="create-channel-form"><input name="name"><label><input type="checkbox" data-testid="create-channel-private">Private</label><button data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><h3 data-testid="channel-settings-title">Channel settings</h3><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" hidden><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge"></span><select data-testid="role-select"></select></div></div><div data-testid="settings-pane-invitations"><button data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><div id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button><div data-testid="invitations-list"><span data-testid="invitation-code"></span></div></div></div><div data-testid="settings-pane-general"></div></div>
<script src="/static/app.js"></script></body></html>
