<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><link rel="stylesheet" href="/static/app.css"></head><body>
<div id="app"><header data-testid="workspace-header"><b>Huddle</b><span data-testid="current-user"></span><button data-testid="logout-btn" data-button-role="danger">Logout</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button></header>
<aside><div data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button></aside>
<main><h2 data-testid="channel-title"># general</h2><div data-testid="channel-topic"></div><button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><section data-testid="message-list"></section><form><input data-testid="message-input" name="body"><button data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<section data-testid="thread-panel" hidden><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Reply</button><button data-testid="close-thread" data-button-role="secondary">Close</button></section>
<div id="auth-modal"><form data-testid="auth-form"><input name="username"><input name="password" type="password"><button data-testid="auth-submit" data-button-role="primary">Login</button><button data-testid="auth-toggle">Sign up</button></form></div>
<div id="create-channel-modal"><form data-testid="create-channel-form"><input name="name"><input data-testid="create-channel-private" type="checkbox"><button type="submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal"><h3 data-testid="channel-settings-title">Channel settings</h3><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal"><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select><button data-testid="workspace-general-submit" data-button-role="primary">Save</button><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><div data-testid="settings-pane-general"></div><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button><div data-testid="invitations-list"></div></form></div><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button>
<form data-testid="workspace-create-form"><input name="slug"><input name="name"><button type="submit" data-testid="empty-state-create-workspace">Create workspace</button></form><form data-testid="join-workspace-form"><input name="code"><button type="submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button></form>
<script src="/static/app.js"></script></div></body></html>
