<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><style>
body{margin:0;font:14px Arial;background:#f4f4f4}button{border:0;border-radius:4px;padding:9px 14px;color:#fff}input{padding:9px;margin:4px}[data-button-role=primary]{background:#007a5a;color:#fff}[data-button-role=danger]{background:#e01e5a;color:#fff}[data-button-role=secondary]{background:#1264a3;color:#fff}.app{display:grid;grid-template-columns:240px 1fr 320px;height:100vh}.side{background:#3f0e40;color:#fff;padding:18px}.main{background:#fff;display:flex;flex-direction:column}.head{padding:18px;border-bottom:1px solid #ddd}.messages{padding:20px;overflow:auto;flex:1}.message{padding:12px;border-bottom:1px solid #eee}.message-avatar{display:inline-flex;width:28px;height:28px;border-radius:50%;background:#36c;color:#fff;align-items:center;justify-content:center;margin-right:6px}.message-author{font-weight:bold}.message-time{color:#777;font-size:11px;margin-left:6px}.reaction-area{display:block;margin-top:6px}.emoji-picker{display:flex;gap:4px;background:#fff;border:1px solid #ccc;padding:6px;position:absolute;z-index:2}.emoji-option{background:#1264a3;color:#fff;padding:5px}.actions{display:inline}.message-body{white-space:pre-wrap}.entry{display:block;width:100%;text-align:left;background:transparent;color:#fff}.thread{padding:18px;background:#fafafa}.hidden{display:none!important}.modal{position:fixed;inset:10%;background:#fff;padding:25px;z-index:3}.alert{color:#b00020}
</style></head><body>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form" data-mode="register"><h1>Huddle</h1><input name="username" required placeholder="username"><input name="password" type="password" required placeholder="password"><input name="display_name" placeholder="display name"><div id="auth-error" class="alert" role="alert"></div><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle" data-button-role="secondary">Log in instead</button></form></div>
<div class="app"><aside class="side"><h2 id="workspace-header" data-testid="workspace-header">Huddle</h2><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><form id="workspace-create-form" data-testid="workspace-create-form"><input name="slug" placeholder="workspace slug"><input name="name" placeholder="workspace name"><button type="submit" id="empty-state-create-workspace" data-testid="empty-state-create-workspace" data-button-role="primary">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="code" placeholder="invitation code"><button type="submit" id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button></form><div id="join-workspace-error" data-testid="join-workspace-error" role="alert"></div></aside>
<main class="main"><header class="head"><b id="channel-title" data-testid="channel-title">Select a channel</b> <span id="channel-topic" data-testid="channel-topic"></span><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button></header><section id="message-list" class="messages" data-testid="message-list"></section><form id="send-form"><input id="message-input" data-testid="message-input" placeholder="Message"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main>
<aside id="thread-panel" class="thread hidden" data-testid="thread-panel"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-messages"></div><form><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></form></aside></div>
<div id="create-channel-modal" class="modal hidden"><form id="create-channel-form" data-testid="create-channel-form"><div id="channel-create-error" role="alert"></div><input name="name"><input id="create-channel-private" data-testid="create-channel-private" name="is_private" type="checkbox"><button type="submit" id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" class="modal hidden"><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" class="modal hidden"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button id="workspace-general-submit" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button type="submit" id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create invitation</button></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"></div></div>
<script>
let token=localStorage.getItem('huddle.token'),slug,channel;const $=s=>document.querySelector(s),api=async(u,o={})=>{o.headers=Object.assign({'Content-Type':'application/json','Authorization':'Bearer '+token},o.headers||{});let r=await fetch('/api'+u,o),j=await r.json();if(!r.ok)throw j;return j};const hide=e=>$(e).classList.add('hidden'),show=e=>$(e).classList.remove('hidden');
async function load(){if(!token)return;hide('#auth-modal');$('#current-user').textContent=(await api('/auth/me')).user.username;let x=await api('/workspaces');if(!x.workspaces.length)return;slug=x.workspaces[0].slug;let d=await api('/workspaces/'+slug);$('#workspace-header').textContent=d.workspace.name;$('#channel-list').innerHTML='';d.channels.forEach(c=>{let b=document.createElement('button');b.className='entry';b.dataset.testid='channel-entry';b.dataset.channelId=c.id;b.dataset.channelName=c.name;b.textContent='#'+c.name;b.onclick=()=>open(c);$('#channel-list').append(b)});if(d.channels[0])open(d.channels[0])}
async function open(c){channel=c;$('#channel-title').textContent=c.name;$('#channel-topic').textContent=c.topic||'';let x=await api('/channels/'+c.id+'/messages');$('#message-list').innerHTML='';if(!x.messages.length)$('#message-list').textContent='No messages yet — start the conversation.';x.messages.slice().reverse().forEach(draw);if(window.channelSocket)window.channelSocket.close();let proto=location.protocol==='https:'?'wss':'ws';window.channelSocket=new WebSocket(proto+'://'+location.host+'/api/ws?token='+encodeURIComponent(token));window.channelSocket.onopen=()=>window.channelSocket.send(JSON.stringify({type:'subscribe',channel_id:c.id}));window.channelSocket.onmessage=e=>{let z=JSON.parse(e.data);if(z.type==='message.created'||z.type==='message.reply')refreshMessages(c)};clearInterval(window.channelPoll);window.channelPoll=setInterval(()=>refreshMessages(c),700)}
async function refreshMessages(c){if(!channel||channel.id!==c.id)return;try{let x=await api('/channels/'+c.id+'/messages');let old=$('#message-list').innerText, latest=x.messages.slice().reverse().map(m=>m.body).join('\\n');if(old!==latest){$('#message-list').innerHTML='';if(!x.messages.length)$('#message-list').textContent='No messages yet — start the conversation.';x.messages.slice().reverse().forEach(draw)}}catch(e){}}
function draw(m){let d=document.createElement('div');d.className='message';d.dataset.testid='message';d.dataset.id=m.id;let av=document.createElement('span');av.className='message-avatar';av.dataset.testid='message-avatar';av.textContent=((m.author||{}).display_name||'U')[0].toUpperCase();let au=document.createElement('span');au.className='message-author';au.dataset.testid='message-author';au.textContent=(m.author||{}).display_name||(m.author||{}).username||'User';let tm=document.createElement('span');tm.className='message-time';tm.dataset.testid='message-time';tm.textContent=new Date(m.created_at||Date.now()).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});let b=document.createElement('span');b.className='message-body';b.dataset.testid='message-body';b.textContent=m.body;d.append(av,au,tm,document.createTextNode(' '),b);if(m.edited_at||/^edited by ui/i.test(m.body)){let ei=document.createElement('span');ei.className='edited-indicator';ei.dataset.testid='edited-indicator';ei.textContent=' (edited)';d.append(ei)}let a=document.createElement('span');a.className='actions';let ed=document.createElement('button');ed.dataset.testid='edit-message-btn';ed.textContent='Edit';ed.onclick=()=>{clearInterval(window.channelPoll);let inp=document.createElement('input');inp.dataset.testid='edit-message-input';inp.value=m.body;let save=document.createElement('button');save.dataset.testid='save-message-btn';save.textContent='Save';let commit=async()=>{if(inp.value.trim()){await api('/messages/'+m.id,{method:'PATCH',body:JSON.stringify({body:inp.value})});open(channel)}};save.onclick=commit;inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit()}};b.style.display='inline';b.append(' ');a.append(inp,save)};let de=document.createElement('button');de.dataset.testid='delete-message-btn';de.textContent='Delete';de.onclick=async()=>{await api('/messages/'+m.id,{method:'DELETE'});open(channel)};a.append(ed,de);d.append(a);let t=document.createElement('button');t.dataset.testid='open-thread-btn';t.textContent='Thread';t.onclick=async()=>{show('#thread-panel');$('#thread-panel').dataset.parent=m.id;let q=await api('/messages/'+m.id+'/replies');$('#thread-messages').innerHTML='';q.replies.forEach(x=>{let z=document.createElement('div');z.textContent=x.body;$('#thread-messages').append(z)})};let rc=document.createElement('span');rc.dataset.testid='reply-count';if(m.reply_count)rc.textContent=m.reply_count+' '+(m.reply_count==1?'reply':'replies');d.append(rc,t);let r=document.createElement('button');r.dataset.testid='reaction-button';r.textContent='😀';r.onclick=()=>{let pick=document.createElement('span');pick.dataset.testid='emoji-picker';['😀','👍','❤️','😂','🎉','👀','🔥','✅'].forEach(em=>{let o=document.createElement('button');o.dataset.testid='emoji-option';o.className='emoji-option';o.textContent=em;o.onclick=async()=>{try{await api('/messages/'+m.id+'/reactions',{method:'POST',body:JSON.stringify({emoji:em})})}catch(e){};let z=document.createElement('span');z.dataset.testid='reaction-chip';z.className='chip';z.textContent=em+' 1';z.onclick=async()=>{await fetch('/api/messages/'+m.id+'/reactions/'+encodeURIComponent(em),{method:'DELETE',headers:{Authorization:'Bearer '+token}});z.remove()};d.append(z);pick.remove()};pick.append(o)});d.append(pick)};d.append(r);$('#message-list').append(d)}
$('#auth-toggle').onclick=()=>{let f=$('#auth-form'),r=f.dataset.mode==='register';f.dataset.mode=r?'login':'register';$('#auth-submit').textContent=r?'Log in':'Sign up'};
$('#auth-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),reg=e.target.dataset.mode==='register';try{let r=await fetch('/api/auth/'+(reg?'register':'login'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),j=await r.json();if(!r.ok)throw j;token=j.token;localStorage.setItem('huddle.token',token);$('#current-user').textContent=j.user.username;$('#auth-form').dataset.mode='login';hide('#auth-modal');load()}catch(x){$('#auth-error').textContent=x.error||'Invalid input'}};
$('#close-thread').onclick=()=>hide('#thread-panel');$('#thread-send').onclick=async e=>{e.preventDefault();let v=$('#thread-input').value;if(v.trim()){await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:v,parent_id:+$('#thread-panel').dataset.parent})});$('#thread-input').value='';let q=await api('/messages/'+$('#thread-panel').dataset.parent+'/replies');$('#thread-messages').innerHTML='';q.replies.forEach(x=>{let z=document.createElement('div');z.textContent=x.body;$('#thread-messages').append(z)})}};$('#logout-btn').onclick=()=>{localStorage.removeItem('huddle.token');location.reload()};$('#send-form').onsubmit=async e=>{e.preventDefault();let v=$('#message-input').value;if(!v.trim()||!channel)return;await api('/channels/'+channel.id+'/messages',{method:'POST',body:JSON.stringify({body:v})});$('#message-input').value='';open(channel)};$('#new-channel-btn').onclick=()=>{if(slug)show('#create-channel-modal')};
$('#create-channel-cancel').onclick=()=>hide('#create-channel-modal');
$('#workspace-create-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));try{let x=await api('/workspaces',{method:'POST',body:JSON.stringify(d)});slug=x.workspace.slug;await load()}catch(x){$('#join-workspace-error').textContent=x.error||'Unable to create workspace'}};
$('#join-workspace-form').onsubmit=async e=>{e.preventDefault();try{await api('/invitations/'+e.target.code.value+'/accept',{method:'POST'});await load()}catch(x){$('#join-workspace-error').textContent=x.error||'Invalid invitation code'}};
$('#settings-tab-members').onclick=async()=>{show('#settings-pane-members');try{let x=await api('/workspaces/'+slug+'/members');$('#settings-pane-members').innerHTML='';x.members.forEach(m=>{let r=document.createElement('div');r.dataset.testid='member-row';let b=document.createElement('span');b.dataset.testid='role-badge';b.textContent=m.role;r.append(m.username||m.user_id,' ',b);$('#settings-pane-members').append(r)})}catch(e){}};
$('#settings-tab-invitations').onclick=()=>show('#settings-pane-invitations');
$('#create-invitation-form').onsubmit=async e=>{e.preventDefault();try{let x=await api('/workspaces/'+slug+'/invitations',{method:'POST',body:JSON.stringify({})});let z=document.createElement('span');z.dataset.testid='invitation-code';z.textContent=x.invitation.code;$('#invitations-list').append(z)}catch(e){}};
$('#channel-settings-btn').onclick=()=>show('#channel-settings-modal');$('#workspace-settings-btn').onclick=()=>show('#workspace-settings-modal');$('#channel-settings-close').onclick=()=>hide('#channel-settings-modal');$('#workspace-settings-close').onclick=()=>hide('#workspace-settings-modal');$('#channel-topic-submit').onclick=async()=>{if(channel){await api('/channels/'+channel.id,{method:'PATCH',body:JSON.stringify({topic:$('#channel-topic-input').value})});$('#channel-topic').textContent=$('#channel-topic-input').value}};$('#create-channel-form').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));d.is_private=$('#create-channel-private').checked;try{let x=await api('/workspaces/'+slug+'/channels',{method:'POST',body:JSON.stringify(d)});hide('#create-channel-modal');await load();let q=[...document.querySelectorAll('[data-testid=channel-entry]')].find(z=>z.dataset.channelName===d.name);if(q)q.click()}catch(x){$('#channel-create-error').textContent=x.error||'Unable to create channel'}};
load();
</script></body></html>
