<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><link rel="stylesheet" href="/style.css"></head><body>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form" data-mode="register"><h2>Huddle</h2><input name="username" placeholder="Username"><input name="password" type="password" placeholder="Password"><input name="display_name" placeholder="Display name"><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button><button type="button" id="auth-toggle" data-testid="auth-toggle">Log in</button><div role="alert"></div></form></div>
<div id="app" class="hidden"><aside><div id="workspace-header" data-testid="workspace-header"></div><div id="current-user" data-testid="current-user"></div><button id="logout-btn" data-testid="logout-btn" data-button-role="danger">Logout</button><button id="workspace-settings-btn" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><div id="channel-list" data-testid="channel-list"></div><div id="dms-list" data-testid="dms-list"></div><button id="new-channel-btn" data-testid="new-channel-btn" data-button-role="secondary">New channel</button></aside><main><header><b id="channel-title" data-testid="channel-title"></b><span id="channel-topic" data-testid="channel-topic"></span><button id="channel-settings-btn" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button></header><div id="message-list" data-testid="message-list"></div><form id="composer"><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></form></main><section id="thread-panel" data-testid="thread-panel" class="hidden"><button id="close-thread" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-content"></div><input id="thread-input" data-testid="thread-input"><button id="thread-send" data-testid="thread-send" data-button-role="primary">Reply</button></section></div>
<div id="empty-state-create-workspace" data-testid="empty-state-create-workspace" class="hidden"><form id="workspace-create-form" data-testid="workspace-create-form"><input name="name"><input name="slug"><button id="workspace-general-submit" type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><form id="join-workspace-form" data-testid="join-workspace-form"><input name="code"><button id="join-workspace-submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><div id="join-workspace-error" data-testid="join-workspace-error" role="alert"></div></form></div>
<div id="create-channel-modal" class="modal hidden"><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><label><input type="checkbox" id="create-channel-private" data-testid="create-channel-private">Private</label><button id="create-channel-submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" id="create-channel-cancel" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div role="alert"></div></form></div>
<div id="channel-settings-modal" class="modal hidden"><h3 id="channel-settings-title" data-testid="channel-settings-title">Channel settings</h3><input id="channel-topic-input" data-testid="channel-topic-input"><button id="channel-topic-submit" data-testid="channel-topic-submit" data-button-role="primary">Save</button><button id="channel-settings-close" data-testid="channel-settings-close" data-button-role="secondary">Close</button><div id="channel-members-list" data-testid="channel-members-list"></div><form id="channel-add-member-form" data-testid="channel-add-member-form"><input id="channel-add-member-input" data-testid="channel-add-member-input"><button id="channel-add-member-submit" data-testid="channel-add-member-submit" data-button-role="primary">Add</button></form><button id="archive-channel-btn" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button id="unarchive-channel-btn" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button></div>
<div id="workspace-settings-modal" class="modal hidden"><button id="workspace-settings-close" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><button id="settings-tab-members" data-testid="settings-tab-members">Members</button><button id="settings-tab-invitations" data-testid="settings-tab-invitations">Invitations</button><button id="settings-tab-general" data-testid="settings-tab-general">General</button><div id="settings-pane-members" data-testid="settings-pane-members"></div><div id="settings-pane-invitations" data-testid="settings-pane-invitations"><button id="create-invitation-btn" data-testid="create-invitation-btn" data-button-role="secondary">Create invitation</button><form id="create-invitation-form" data-testid="create-invitation-form"><button id="create-invitation-submit" data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div id="invitations-list" data-testid="invitations-list"></div></div><div id="settings-pane-general" data-testid="settings-pane-general"><input id="workspace-name-input" data-testid="workspace-name-input"><select id="workspace-join-mode" data-testid="workspace-join-mode"></select></div></div><script src="/app.js"></script></body></html>
