<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><link rel="stylesheet" href="/app.css"></head><body>
<div id="app"><aside><header id="workspace-header" data-testid="workspace-header">Huddle</header><div id="channel-list" data-testid="channel-list"></div><div data-testid="dms-list"></div><button data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button data-testid="workspace-settings-btn" data-button-role="secondary">Settings</button><button data-testid="logout-btn" data-button-role="danger">Logout</button></aside><main><h2 id="channel-title" data-testid="channel-title">general</h2><div id="channel-topic" data-testid="channel-topic"></div><div id="message-list" data-testid="message-list"></div><input id="message-input" data-testid="message-input"><button id="send-btn" data-testid="send-btn" data-button-role="primary">Send</button></main><section id="thread-panel" data-testid="thread-panel" hidden><button data-testid="close-thread" data-button-role="secondary">Close</button><input data-testid="thread-input"><button data-testid="thread-send" data-button-role="primary">Send</button></section></div>
<div id="auth-modal"><form id="auth-form" data-testid="auth-form"><input name="username"><input name="password" type="password"><button type="button" id="auth-toggle" data-testid="auth-toggle" type="button">Login</button><button id="auth-submit" data-testid="auth-submit" data-button-role="primary">Sign up</button></form></div>
<div id="create-channel-modal" hidden><form id="create-channel-form" data-testid="create-channel-form"><input name="name"><input id="create-channel-private" data-testid="create-channel-private" type="checkbox"><button type="submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button></form></div>
<div id="channel-settings-modal" hidden><input data-testid="channel-topic-input"><button data-testid="channel-topic-submit" data-button-role="primary">Save</button><button data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal"><button data-testid="settings-tab-members">Members</button><button data-testid="settings-tab-invitations">Invitations</button><div data-testid="settings-pane-members"></div><div data-testid="settings-pane-invitations"></div><button data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><button data-testid="workspace-settings-close" data-button-role="secondary">Close</button></div><div id="current-user" data-testid="current-user"></div>
<div data-testid="empty-state-create-workspace" hidden><form data-testid="workspace-create-form"><input name="name"><input name="slug"><button type="submit" data-testid="workspace-general-submit" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form"><input name="code"><button type="submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><div data-testid="join-workspace-error"></div></form></div>
<input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"></select>
<button data-testid="workspace-general-submit" data-button-role="primary">Save workspace</button>
<button data-testid="channel-settings-btn" data-button-role="secondary">Channel settings</button><div data-testid="channel-settings-title"></div><div data-testid="channel-members-list"></div>
<form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form>
<button data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button>
<button data-testid="settings-tab-general">General</button><div data-testid="settings-pane-general"></div><div data-testid="invitations-list"></div>
<script src="/app.js"></script></body></html>
