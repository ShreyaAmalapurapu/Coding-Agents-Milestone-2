<!doctype html><html><head><meta charset="utf-8"><title>Huddle</title><link rel="stylesheet" href="/app.css"></head><body>
<section id="auth-modal"><form data-testid="auth-form" data-mode="register"><h2>Huddle</h2><input name="username"><input name="password" type="password"><button type="submit" data-testid="auth-submit" data-button-role="primary">Continue</button><button type="button" data-testid="auth-toggle">Log in</button><div role="alert"></div></form></section>
<main class="layout" hidden><aside><header data-testid="workspace-header"></header><div data-testid="current-user"></div><button type="button" data-testid="logout-btn" data-button-role="danger">Logout</button><button type="button" data-testid="new-channel-btn" data-button-role="secondary">New channel</button><button type="button" data-testid="workspace-settings-btn" data-button-role="secondary">Workspace settings</button><div data-testid="channel-list"></div><div data-testid="dms-list"></div></aside>
<section class="message-pane"><header><b data-testid="channel-title"></b><span data-testid="channel-topic"></span><button type="button" data-testid="channel-settings-btn" data-button-role="secondary">Settings</button></header><div data-testid="message-list"></div><form id="composer"><input data-testid="message-input"><button type="submit" data-testid="send-btn" data-button-role="primary">Send</button></form></section>
<section data-testid="thread-panel" hidden><button type="button" data-testid="close-thread" data-button-role="secondary">Close</button><div id="thread-content"></div><input data-testid="thread-input"><button type="button" data-testid="thread-send" data-button-role="primary">Reply</button></section></main>
<div id="create-channel-modal" hidden><form data-testid="create-channel-form"><input name="name"><input type="checkbox" data-testid="create-channel-private"><button type="submit" data-testid="create-channel-submit" data-button-role="primary">Create</button><button type="button" data-testid="create-channel-cancel" data-button-role="secondary">Cancel</button><div role="alert"></div></form></div>
<div id="channel-settings-modal" hidden><h3 data-testid="channel-settings-title">Channel settings</h3><div data-testid="channel-members-list"></div><form data-testid="channel-add-member-form"><input data-testid="channel-add-member-input"><button type="submit" data-testid="channel-add-member-submit" data-button-role="primary">Add member</button></form><input data-testid="channel-topic-input"><button type="button" data-testid="channel-topic-submit" data-button-role="primary">Save topic</button><button type="button" data-testid="archive-channel-btn" data-button-role="danger">Archive</button><button type="button" data-testid="unarchive-channel-btn" data-button-role="secondary">Unarchive</button><button type="button" data-testid="channel-settings-close" data-button-role="secondary">Close</button></div>
<div id="workspace-settings-modal" hidden><button type="button" data-testid="workspace-settings-close" data-button-role="secondary">Close</button><input data-testid="workspace-name-input"><select data-testid="workspace-join-mode"><option>open</option><option>invite_only</option></select><button type="button" data-testid="workspace-general-submit" data-button-role="primary">Save</button><button type="button" data-testid="settings-tab-members">Members</button><button type="button" data-testid="settings-tab-invitations">Invitations</button><button type="button" data-testid="settings-tab-general">General</button><div data-testid="settings-pane-members"><div data-testid="member-row"><span data-testid="role-badge">owner</span><select data-testid="role-select"><option>owner</option><option>admin</option><option>member</option></select></div></div><div data-testid="settings-pane-invitations"><button type="button" data-testid="create-invitation-btn" data-button-role="secondary">Invite</button><form id="create-invitation-form" data-testid="create-invitation-form"><button type="submit" data-testid="create-invitation-submit" data-button-role="primary">Create</button></form><div data-testid="invitations-list"></div></div><div data-testid="settings-pane-general"></div></div>
<div data-testid="empty-state-create-workspace" hidden><form data-testid="workspace-create-form"><input name="name"><input name="slug"><button type="submit" data-button-role="primary">Create workspace</button></form><form data-testid="join-workspace-form"><input name="code"><button type="submit" data-testid="join-workspace-submit" data-button-role="primary">Join</button><div data-testid="join-workspace-error" role="alert"></div></form></div>
<script src="/app.js"></script></body></html>
